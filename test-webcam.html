<!DOCTYPE html>
<html>
<head><title>Webcam Test</title></head>
<body style="background:#222; color:#fff; font-family:sans-serif; padding:20px;">
<h3>Test Webcam Minimal</h3>
<button onclick="start({})">Start (default)</button>
<button onclick="start({width:640,height:480})">Start 640x480</button>
<button onclick="start({width:1280,height:720})">Start 720p</button>
<button onclick="start({frameRate:15})">Start 15fps</button>
<button onclick="start({width:640,height:480,frameRate:15})">Start 640x480@15fps</button>
<button onclick="stop()">Stop</button>
<div id="info" style="margin-top:8px; font-size:12px; color:#aaa;"></div>
<div id="container" style="margin-top:10px; width:640px; height:480px; background:#000; border:1px solid #555;"></div>
<script>
let stream = null;
async function start(opts) {
  stop();
  try {
    const constraints = { video: opts && Object.keys(opts).length ? opts : true };
    document.getElementById('info').textContent = 'Constraints: ' + JSON.stringify(constraints);
    stream = await navigator.mediaDevices.getUserMedia(constraints);
    const track = stream.getVideoTracks()[0];
    const settings = track.getSettings();
    document.getElementById('info').textContent += '\nSettings: ' + JSON.stringify(settings);
    const video = document.createElement('video');
    video.autoplay = true;
    video.muted = true;
    video.playsInline = true;
    video.style.cssText = 'width:100%; height:100%; object-fit:contain;';
    video.srcObject = stream;
    document.getElementById('container').innerHTML = '';
    document.getElementById('container').appendChild(video);
    video.play();
  } catch(e) {
    document.getElementById('info').textContent = 'Error: ' + e.message;
  }
}
function stop() {
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  document.getElementById('container').innerHTML = '';
}
</script>
</body>
</html>
